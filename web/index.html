function serviceGroups(){const byKey=Object.create(null),groups=[];for(const s of selections()){if(!s||typeof s!=='object')continue;const family=familyOf(s);if(!Object.prototype.hasOwnProperty.call(byKey,family.key)){const group={key:family.key,name:family.name,kind:family.kind,category:String(s.category||''),services:[]};byKey[family.key]=group;groups.push(group)}byKey[family.key].services.push(s)}return groups.sort((a,b)=>{const priority=categoryRank(a)-categoryRank(b);if(priority)return priority;const x=String(a.name||'').toLowerCase(),y=String(b.name||'').toLowerCase();return x<y?-1:x>y?1:0})}

async function submitBooking(e){e.preventDefault();if(demo||ME.bookingSubmitting||ME.bookingDone)return;ME.clientName=document.getElementById('booking-name').value.trim();ME.clientPhone=document.getElementById('booking-phone').value.trim();ME.comment=document.getElementById('booking-comment').value.trim();ME.consent=document.getElementById('booking-consent').checked;if(!ME.consent){toast('Подтверди согласие на обработку данных.');return}if(!/^\+?[\d()\s-]{10,50}$/.test(ME.clientPhone)||ME.clientPhone.replace(/\D/g,'').length<10){toast('Проверь номер телефона');return}ME.bookingSubmitting=true;ME.bookingError='';render();try{const data=await api('/api/booking/create',{requestKey:ME.requestKey,nameClient:ME.clientName,phoneClient:ME.clientPhone,comment:ME.comment,date:ME.date,timeFrom:ME.time,masterID:Number(ME.master),serviceID:Number(ME.service),tetradkaPersonalDataProcessing:true});ME.bookingDone=data;ME.step=5}catch(error){ME.bookingError=error.message}finally{ME.bookingSubmitting=false;render()}}

const outreachText=v=>({telegram_sent:'Telegram: отправка подтверждена NEFOR SPOT',telegram_pending:'Telegram: ожидает отправки NEFOR SPOT',telegram_available_auto_off:'TG NEFOR SPOT доступен, автоотправка отключена',sms_needed:'ChatPush не проверен — проверь перед SMS',verify_first:'Проверить неопределённый результат Telegram',missing_phone:'Нет номера телефона',disabled:'Уведомления запрещены',handled:'Обработано вручную'})[v.outreach_state]||'Статус уведомления неизвестен';
function adminNotice(v){const cp=v.chatpush_delivery||{},history=v.chatpush_external_history||{},state=v.notice_state||'';if(v.manual_state==='sms_sent'||(state==='notified'&&v.notice_channel==='sms'))return {bucket:'notified',label:'SMS · отмечено вручную',klass:'ok',source:'Отметка администратора'};if(v.manual_state==='confirmed'||state==='confirmed')return {bucket:'notified',label:'Клиент подтвердил',klass:'ok',source:'Отметка администратора'};if(cp.state==='delivered'||cp.state==='read')return {bucket:'notified',label:cp.state==='read'?'TG · прочитано · ChatPush':'TG · доставлено · ChatPush',klass:'ok',source:'Подтверждённый ответ ChatPush'};if(state==='notified'||v.outreach_state==='telegram_sent'){const external=v.notice_source==='chatpush_external_history';return {bucket:'notified',label:external?'TG · история ChatPush':v.notice_source==='chatpush_admin_verified'?'TG · доставлено · ChatPush (сверено)':'TG · доставлено',klass:'ok',source:external?'Подтверждена последняя Telegram-доставка по номеру; не обязательно для конкретного визита':v.notice_source==='chatpush_admin_verified'?'Проверено администратором по истории ChatPush':'Журнал доставки'}}if(v.notice_source==='chatpush_external_history'){if(history.state==='no_telegram')return {bucket:'sms',label:'Telegram не найден · ChatPush',klass:'warn',source:'Последний подтверждённый ответ Telegram в истории ChatPush'};if(history.state==='pending')return {bucket:'check',label:'ChatPush · в очереди',klass:'warn',source:'Не отправлять SMS до окончательного результата'};if(history.state==='telegram')return {bucket:'notified',label:'Telegram · ChatPush',klass:'ok',source:'Последнее Telegram-сообщение по истории ChatPush'}}if(v.manual_state==='skipped'||state==='skipped')return {bucket:'other',label:'Пропущено вручную',klass:'',source:'Отметка администратора'};if(state==='disabled'||v.notifications_disabled)return {bucket:'other',label:'Уведомления отключены',klass:'',source:'Тетрадка'};if(cp.state==='accepted')return {bucket:'check',label:'ChatPush · в очереди',klass:'warn',source:'Ожидается финальный статус ChatPush'};if(cp.state==='attempting'||cp.state==='uncertain')return {bucket:'check',label:'ChatPush · результат неясен',klass:'warn',source:'Требуется ручная проверка, не повторять'};if(cp.state==='failed'||cp.state==='rejected')return {bucket:'sms',label:'ChatPush · ошибка Telegram',klass:'warn',source:'Не доставлено, нужна ручная связь'};if(v.notice_source==='chatpush_admin_verified'&&v.outreach_state==='sms_needed')return {bucket:'sms',label:'ChatPush · не доставлено (сверено)',klass:'warn',source:'Проверено администратором в ChatPush'};if(state==='check'||v.outreach_state==='verify_first')return {bucket:'check',label:'Сверить историю ChatPush',klass:'warn',source:'Неизвестный результат не означает необходимость SMS'};if(state==='pending'||v.outreach_state==='telegram_pending')return {bucket:'check',label:'TG · ожидается',klass:'warn',source:'Журнал NEFOR SPOT'};if(!v.phone)return {bucket:'other',label:'Нет номера',klass:'warn',source:'Тетрадка'};return {bucket:'check',label:'ChatPush не сверен',klass:'warn',source:'Нет доказательств, что нужна SMS'}}
function normalizedSmsPhone(raw){let v=String(raw||'').replace(/[^0-9]/g,'');if(v.length===10)v='7'+v;if(v.length===11&&v.charAt(0)==='8')v='7'+v.slice(1);return /^7[0-9]{10}$/.test(v)?'+'+v:''}

iv class="stack">'+btn('Telegram доставлено — убрать из SMS','chatpush-reconcile:delivered','btn-block')+btn('ChatPush не доставил — нужна SMS','chatpush-reconcile:failed','btn-primary btn-block')+btn('Исход неизвестен — оставить на проверке','chatpush-reconcile:unknown','btn-block')+'</div>'}if(info.bucket!=='sms')html+='<div class="notice">Ручная SMS не разрешена, пока нет подтверждённой недоставки ChatPush.</div>';html+='<h2 class="section-title">SMS вручную</h2>';if(phone&&smsEligible){html+='<div class="sms-flow">';html+='<div class="sms-flow-step"><b>1. Скопировать номер</b>'+btn('Скопировать '+phone,'copy-phone','btn-block')+'</div>';html+='<div class="sms-flow-step"><b>2. Скопировать сообщение</b><div class="sms-preview">'+ESC(localSms(v))+'</div>'+btn('Скопировать текст SMS','copy-sms','btn-primary btn-block')+'</div>';html+='<div class="sms-flow-step"><b>3. Открыть «Сообщения» на телефоне</b><a class="btn btn-block" href="sms:'+ESC(phone)+'">Открыть SMS для '+ESC(phone)+'</a><p class="small-help">Вставь текст, отправь SMS вручную и вернись в NEFOR SPOT.</p></div>';if(smsEligible){html+='<div class="sms-flow-step sms-ack"><b>4. Зафиксировать отправку</b><label class="sms-ack-label"><input type="checkbox" id="sms-acknowledge"><span>Я действительно отправил(а) SMS этому клиенту.</span></label><button type="button" class="btn btn-primary btn-block" data-action="mark:sms_sent" id="mark-sms-sent" disabled>✓ SMS отправлена — сохранить отметку</button></div>'}else if(smsAlreadySent)html+='<div class="notice">✓ SMS отмечена отправленной. На главном экране клиент числится уведомлённым.</div>';html+='</div>'}else if(smsAlreadySent)html+='<div class="notice">SMS отмечена отправленной. Повторное сообщение не требуется.</div>';else if(phone)html+='<div class="notice">Ручная SMS недоступна: нет подтверждения, что ChatPush не доставил сообщение. Сначала проверь историю Telegram.</div>';else html+='<div class="notice">Для этого визита в Тетрадке нет подходящего номера. SMS function adminClients(){return `<h1 class="page-title">База клиентов</h1>${neforPageCaption('Информация из Tetradka. Только администратору.')}<input id="search-clients" class="field" placeholder="Найти по имени или телефону" value="${ESC(ME.search)}" autocomplete="off"><div class="spacer"></div><div id="client-list" class="stack"></div><div class="spacer"></div>${btn('Обновить базу','clients-load','btn-block')}`}

function adminTicket(){const t=ME.selectedTicket;if(!t)return adminTickets();const direct=t.telegram_username?`<div class="notice">Личный ответ от твоего аккаунта: @${ESC(t.telegram_username)}. Доставка через личный Telegram не отслеживается в приложении.</div>${btn('Открыть личный чат','direct-chat','btn-block')}`:'<div class="notice">Telegram-имя клиента неизвестно. Напиши ответ здесь, либо свяжись вручную по известным контактам.</div>';return neforPageHeader(`Обращение №${t.id}`,`${t.name} · ${t.status}`,'tickets')+direct+`<div id="admin-ticket-thread" class="stack"><div class="loading">Загружаю переписку…</div></div><div class="spacer"></div>${t.status==='closed'?'<div class="notice">Обращение закрыто.</div>':`<form id="reply-form" class="form"><label>Ответ клиенту<textarea id="reply-text" class="field field-area" maxlength="1500" required placeholder="Напиши ответ…"></textarea></label><button class="btn btn-primary btn-block" type="submit">Отправить ответ</button></form><div class="spacer"></div>${btn('Закрыть обращение','ticket-close','btn-block')}`}`}
function adminSystem(){return `<h1 class="page-title">Система</h1>${neforPageCaption('NEFOR SPOT — собственная система записи и подтверждений.')}<div class="stack"><div class="card"><b>Tetradka</b><p>Источник расписания, записей и клиентов.</p><div id="crm-connection" class="notice">Доступ не проверен.</div>${btn('Проверить подключение CRM','crm-check','btn-block')}</div><div class="card"><b>Обращения в Mini App</b><p>Вопросы и ответы доступны внутри приложения. Клиентскому боту сообщения не отправляются.</p></div><div class="card"><b>Обращения клиентов</b><p>Текстовые вопросы получает администратор. Автоматические ответы отключены.</p><span class="status-pill">Ответы сотрудников</span></div><div class="card"><b>Запись в салон</b><p>Прямое создание визитов и получение свободных дат через Tetradka.</p></div><div class="card"><b>ChatPush · внешняя автоматическая отправка</b><p>Telegram-уведомления отправляет существующая интеграция ChatPush и Тетрадки. NEFOR SPOT не отправляет их повторно.</p><div id="chatpush-health" class="notice">Проверяю доступ к API…</div>${btn('Проверить ChatPush API','chatpush-check','btn-block')}<p class="small-help">API-подключение само по себе не даёт историю отправок внешней интеграции. Без подтверждения доставки клиент не попадает в SMS.</p></div><h2 class="section-title">Уведомления клиентов</h2><div id="notification-audit" class="stack"><div class="loading">Загрузка…</div></div><div class="spacer"></div>${btn('Обновить уведомления','notifications-load','btn-block')}<h2 class="section-title">Созданные через Mini App записи</h2><div id="booking-audit" class="stack"><div class="loading">Загрузка…</div></div><div class="spacer"></div>${btn('Обновить','bookings-load','btn-block')}</div>`}
function adminRender(){switch(ME.view){case 'tomorrow':return adminTomorrow();case 'detail':return adminDetail();case 'clients':return adminClients();case 'tickets':return adminTickets();case 'ticket':return adminTicket();case 'system':return adminSystem();default:return adminTomorrow()}}
function nav(){const entries=adminMode?[['tomorrow','▣','Завтра'],['clients','♙','Клиенты'],['tickets','▤','Обращения'],['system','⚙','Система']]:[['home','⌂','Главная'],['book','▣','Запись'],['my','◷','Мои записи'],['support','◉','Помощь']];NAV.innerHTML=entries.map(([id,icon,label])=>`<button class="nav-btn ${(ME.view===id||(id==='tomorrow'&&ME.view==='detail')||(id==='tickets'&&ME.view==='ticket'))?'active':''}" data-action="go:${id}"><span class="nav-icon">${icon}</span>${ESC(label)}</button>`).join('')}
function render(){ROOT.innerHTML=adminMode?adminRender():clientRender();nav();if(ME.view==='tomorrow')loadTomorrow();if(ME.view==='tickets')loadTickets();if(ME.view==='ticket')loadAdminThread();if(ME.view==='clients')loadClients();if(ME.view==='my')loadMy();if(ME.view==='system'){loadAdminBookings();loadNotifications();checkChatpush();}}
function recoverBookingRender(error){iosProbe('nav-render-failed');iosError(error);try{ROOT.innerHTML='<section class="empty"><h1 class="page-title">Онлайн-запись</h1><p>Ошибка отображения. Повтори открытие раздела.</p><button type="button" class="btn btn-primary btn-block" data-action="go:book">Повторить</button></section>';status('Ошибка отображения Mini App. Попробуй ещё раз.')}catch(_){status('Ошибка отображения Mini App.')}}
function go(s){if(!adminMode&&(s==='support'||s==='assistant'||s==='support-thread')){ME.view='support';render();openPersonalAdminChat();return}ME.view=s;try{render()}catch(e){if(s==='book')recoverBookingRender(e);else{iosProbe('nav-render-failed');iosError(e);status('Ошибка перехода. Открой другой раздел или перезапусти приложение.')}return}try{window.scrollTo(0,0)}catch(e){}if(['book','masters','services','price'].includes(s))loadCatalog()}
function selectService(id){const group=serviceGroups().find(g=>g.services.some(s=>String(s.id)===String(id)));if(!group)return;chooseGroup(group.key)}
function selectMaster(id){ME.master=String(id);ME.hairLength='';const choices=candidatesForMaster(id);ME.service=!needsLength()&&choices.length===1?String(choices[0].id):'';clearCalendar();render()}
function demoRows(){return []}
const DEMO_CLIENTS=[];
const DEMO_TICKETS=[];
async function checkChatpush(){const box=document.getElementById('chatpush-health');if(!box)return;box.textContent='Проверяю доступ к API…';try{const result=await api('/api/admin/chatpush/status');box.textContent=result.available?'API ChatPush доступен. Внешние отправки выполняет ChatPush; история интеграции пока не подключена.':'Нет подтверждения доступа к API ChatPush. HTTP '+String(result.api_http_status)+'.'}catch(error){box.textContent='Не удалось проверить ChatPush: '+String(error.message||'ошибка')}}
async function loadTomorrow(){const root=document.getElementById('tomorrow-list'),sum=document.getElementById('summary');if(root&&sum){sum.innerHTML='<span>Загрузка расписания…</span>';root.innerHTML='<div class="loading">Проверяю визиты Тетрадки на завтрашнюю дату…</div>'}try{const data=await api('/api/admin/tomorrow');ME.visits=Array.isArray(data.visits)?data.visits:[];ME.fresh=data.fresh===true;ME.scheduleTimestamp=data.fetched_at;ME.tomorrowDay=String(data.day||'');ME.tomorrowCode=String(data.diagnostic_code||'');ME.tomorrowCache=data.cache_available===true;ME.chatpushConnected=data.chatpush_connected===true;ME.chatpushHistory=data.chatpush_history||{};if(root)drawTomorrow()}catch(error){ME.fresh=false;ME.tomorrowCache=false;ME.tomorrowCode='app_request_failed';if(sum)sum.innerHTML='<span>Не удалось обновить Тетрадку</span>';if(root)root.innerHTML='<div class="notice">'+ESC(error.message)+' Нажми «Обновить записи» для повтора.</div>';const filters=document.getElementById('tomorrow-filters');if(filters)filters.innerHTML=''}}
function drawTomorrow(){const root=document.getElementById('tomorrow-list'),sum=document.getElementById('summary'),filters=document.getElementById('tomorrow-filters');if(!root)return;const list=Array.isArray(ME.visits)?ME.visits:[];const count={all:list.length,notified:0,sms:0,check:0,other:0};for(const visit of list){const key=adminNotice(visit).bucket;if(Object.prototype.hasOwnProperty.call(count,key))count[key]++}const day=String(ME.tomorrowDay||'').slice(0,10);const note=document.getElementById('chatpush-history-note');if(note){const h=ME.chatpushHistory||{};note.textContent=h.connected?'История внешних уведомлений ChatPush подключена. SMS только при подтверждённой ошибке Telegram.':'История внешних уведомлений ChatPush не подключена. Без проверки отправок нельзя считать неизвестных клиентов неавторизованными в Telegram.'}let summary='';if(ME.fresh){const telegramCount=list.filter(v=>v.notice_state==='notified'&&v.notice_channel==='telegram').length;summary='<span>Завтра '+ESC(day)+' · всего визитов: '+list.length+'</span>'+'<span>Telegram: '+telegramCount+'</span><span>Требуют SMS: '+count.sms+'</span>'+'<span>Уведомлены: '+count.notified+'</span><span>Нужна связь / SMS: '+count.sms+'</span><span>Проверить Telegram: '+count.check+'</span>'}else if(ME.tomorrowCache){summary='<span>Сохранённый список на '+ESC(day)+': '+list.length+' визитов · НЕ ОБНОВЛЁН</span>'}else{summary='<span>Нет актуального списка на '+ESC(day)+'</span>'}sum.innerHTML=summary;const keys=[['all','Все'],['notified','Уведомлены'],['sms','Нужна SMS'],['check','Проверить TG'],['other','Прочие']];if(filters){filters.innerHTML=keys.map(([key,label])=>'<button type="button" class="chip'+(ME.tomorrowFilter===key?' active':'')+'" data-tomorrow-filter="'+key+'">'+ESC(label)+' · '+count[key]+'</button>').join('')}let warning='';if(!ME.fresh){warning='<div class="notice"><strong>Тетрадка не ответила. Статусы и действия неактуальны.</strong> ';warning+=(ME.tomorrowCache?'Показана только последняя сохранённая копия за '+ESC(day)+(ME.scheduleTimestamp?', получена '+ESC(ME.scheduleTimestamp):'')+'. ':'Для '+ESC(day)+' сохранённой копии ещё нет. ');warning+='Причина: '+ESC(ME.tomorrowCode||'неизвестна')+'. Повтори обновление.</div>'}const chosen=list.map((v,i)=>({v,i})).filter(({v})=>ME.tomorrowFilter==='all'||adminNotice(v).bucket===ME.tomorrowFilter);let lines='';for(const {v,i} of chosen){const info=adminNotice(v);lines+='<button type="button" class="visit-line" data-visit="'+i+'"><span class="time">'+ESC(v.at_time)+'</span><span class="body"><b>'+ESC(v.name)+'</b><small>'+ESC(v.master)+' · '+ESC(v.service)+'</small><small class="notice-source">'+ESC(info.source)+'</small></span><span class="badge '+info.klass+'">'+ESC(info.label)+'</span></button>'}root.innerHTML=warning+(lines||'<div class="empty">'+(ME.fresh?(list.length?'Нет клиентов в выбранной категории.':'Завтра нет записей по данным Тетрадки.'):'Нет сохранённых визитов в этой категории. Нажми «Обновить записи».')+'</div>');status(ME.fresh?'':('Тетрадка временно не обновляется · '+(ME.tomorrowCode||'')))}
async function loadTickets(){const root=document.getElementById('tickets-list');if(!root)return;if(demo){if(!ME.tickets.length)ME.tickets=DEMO_TICKETS.map(x=>({...x}));drawTickets(root);return}root.innerHTML='<div class="loading">Загрузка…</div>';try{const d=await api('/api/admin/tickets');ME.tickets=d.tickets||[];drawTickets(root)}catch(e){root.innerHTML=`<div class="empty">${ESC(e.message)}</div>`}}
function drawTickets(root){root.innerHTML=ME.tickets.length?ME.tickets.map((t,i)=>`<button class="list-row" data-ticket="${i}"><span><b>№${ESC(t.id)} · ${ESC(t.name)}</b><small>${ESC(t.content).slice(0,110)}</small></span><span class="badge">${ESC(t.status==='closed'?'Закрыто':t.status==='answered'?'Отвечено':'Открыто')}</span></button>`).join(''):'<div class="empty">Новых обращений нет.</div>'}
async function loadClients(){const root=document.getElementById('client-list');ME.clients=[];if(demo){ME.clients=DEMO_CLIENTS;showClients();return}root.innerHTML='<div class="loading">Загрузка базы…</div>';try{const d=await api('/api/admin/clients');ME.clients=d.clients||[];ME.clientsFresh=d.fresh===true;showClients()}catch(e){root.innerHTML=`<div class="empty">${ESC(e.message)}</div>`}}
function showClients(){const box=document.getElementById('client-list');if(!box)return;if(demo&&!ME.clients.length)ME.clients=DEMO_CLIENTS;const q=ME.search.toLowerCase();const arr=ME.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)).slice(0,45);box.innerHTML=(ME.clientsFresh?'<div class="notice">База обновлена из CRM.</div>':'')+(arr.length?arr.map(c=>`<div class="list-row"><span><b>${ESC(c.name)}</b><small>${ESC(c.phone||'Телефон не указан')} · Последний визит: ${ESC(c.last_visit||'—')}</small></span></div>`).join(''):'<div class="empty">Клиенты не загружены или не найдены. Нажми «Обновить базу».</div>')}
async function loadMy(){const box=document.getElementById('visits-view');if(!box)return;box.innerHTML='<div class="loading">Проверяю Tetradka…</div>';try{const d=await api('/api/client/my-visits');ME.myVisits=d.visits||[];const phone=d.requires_phone?`<div class="notice">Для доступа к записям из Tetradka нажми «Подтвердить номер» ниже, прямо в Mini App. Переход в чат бота не нужен, уведомления не включаются.</div>${btn('Подтвердить номер в приложении','phone-verify','btn-primary btn-block')}`:'';const visits=ME.myVisits.map((v,i)=>{const cancelled=v.status==='cancel';const statusText=cancelled?'Запись отменена':v.fresh?'Запись подтверждена':'Запись оформлена';const role=founderMaster({name:v.master})?'Основатель ':'Мастер: ';return '<div class="card visit-card">'+'<div class="visit-summary"><b>'+ESC(shortVisitDate(v.date))+' · '+ESC(v.time)+'</b><span class="visit-state">'+ESC(statusText)+'</span></div>'+'<h3 class="visit-service">'+ESC(v.service||'Услуга')+'</h3><p class="visit-master">'+ESC(role+String(v.master||'Не указан'))+'</p>'+'<div class="stack">'+(v.can_reschedule?btn('Перенести','visit-reschedule:'+i,'btn-block'):'')+(cancelled?'':'<p class="section-caption">Отмена — через чат с администратором.</p>'+btn('Отменить запись','visit-cancel-help:'+i,'btn-block')+'<a class="visit-admin-link" href="'+ESC(adminTelegramUrl())+'" target="_blank" rel="noopener noreferrer">Чат администратора ↗</a>')+'</div></div>'}).join('');const empty='<div class="empty">Здесь появятся твои записи.</div>';if(!readPending()&&d.pending_actions?.length)savePending(d.pending_actions[0]);const pending=readPending();box.innerHTML=phone+(visits||empty)+(pending?`<div class="notice">Проверь результат предыдущего изменения.</div>${btn('Проверить результат','visit-status','btn-block')}`:'')}catch(e){box.innerHTML='<div class="notice">Не удалось обновить записи. Попробуй ещё раз.</div>'}}
async function loadAdminBookings(){const box=document.getElementById('booking-audit');if(!box)return;if(demo){box.innerHTML='<div class="notice">Демонстрация: реальные записи не загружаются.</div>';return}try{const d=await api('/api/admin/bookings');const bookings=d.bookings||[];box.innerHTML=bookings.length?bookings.map(b=>`<div class="list-row"><span><b>${ESC(b.appointment_date)} · ${ESC(b.appointment_time)}</b><small>${ESC(b.master_name)} · ${ESC(b.service_name)}</small><small>${b.status==='done'?'✓ Создано в Tetradka, визит №'+ESC(b.visit_id):b.status==='uncertain'?'⚠ Результат неизвестен — требуется проверка':b.status==='pending'?'⏳ Обрабатывается':'Запись отклонена'}</small></span></div>`).join(''):'<div class="empty">Через Mini App пока записей нет.</div>'}catch(e){box.innerHTML=`<div class="notice">${ESC(e.message)}</div>`}}
async function loadNotifications(){const box=document.getElementById('notification-audit');if(!box)return;if(demo){box.innerHTML='<div class="notice">В демо уведомления не отправляются.</div>';return}try{const data=await api('/api/admin/notifications');const statuses={sent:'Telegram отправлено',manual_sms_sent:'SMS вручную отмечена',sms_accepted:'Старый статус SMS — проверить',manual:'Отправить SMS с телефона',needs_review:'Проверить результат отправки',queued:'В очереди',attempting:'Проверить неопределённый результат'};box.innerHTML=`<div class="notice">Ручная обработка: ${ESC(data.manual_count)} · SMS отправляет администратор вручную</div>`+(data.messages||[]).slice(0,30).map(m=>`<div class="list-row"><span><b>${ESC(m.day)} · ${ESC(m.at_time)} · ${ESC(m.kind)}</b><small>${ESC(m.phone?'+'+m.phone:'Нет телефона')} · ${ESC(statuses[m.state]||m.state)}</small><small>${ESC(m.detail||'')}</small></span></div>`).join('')}catch(err){box.innerHTML=`<div class="notice">${ESC(err.message)}</div>`}}
async function loadSupportTickets(){const box=document.getElementById('support-history');if(!box)return;if(demo){box.innerHTML='<div class="notice">Для обращений открой приложение из Telegram.</div>';return}try{const d=await api('/api/client/tickets');box.innerHTML=(d.tickets||[]).length?d.tickets.map(t=>`<button class="list-row" data-client-ticket="${Number(t.id)}"><span><b>Обращение №${Number(t.id)}</b><small>${ESC(t.content).slice(0,85)}</small></span><span class="badge">${ESC(t.status==='answered'?'Ответили':t.status==='closed'?'Закрыто':'Ожидает ответа')}</span></button>`).join(''):'<div class="empty">Пока нет обращений.</div>'}catch(e){box.innerHTML=`<div class="notice">${ESC(e.message)}</div>`}}
function formatThread(messages){return (messages||[]).map(m=>`<div class="card"><span class="mini-label">${m.who==='admin'?'Администратор':'Ты'} · ${ESC(m.created_at||'')}</span><p style="white-space:pre-wrap">${ESC(m.text)}</p></div>`).join('')||'<div class="empty">Сообщений нет.</div>'}
async function loadSupportThread(){const box=document.getElementById('support-conversation');if(!box||!ME.selectedTicketId)return;try{const data=await api(`/api/client/ticket-messages?ticket_id=${encodeURIComponent(ME.selectedTicketId)}`);box.innerHTML=formatThread(data.messages);const form=document.getElementById('support-reply-form');if(form)form.hidden=data.status==='closed'}catch(e){box.innerHTML=`<div class="notice">${ESC(e.message)}</div>`}}
async function loadAdminThread(){const box=document.getElementById('admin-ticket-thread');if(!box||!ME.selectedTicket)return;try{const data=await api(`/api/admin/ticket-messages?ticket_id=${encodeURIComponent(ME.selectedTicket.id)}`);box.innerHTML=formatThread(data.messages)}catch(e){box.innerHTML=`<div class="notice">${ESC(e.message)}</div>`}}
async function submitSupportReply(e){e.preventDefault();const msg=document.getElementById('support-reply-text')?.value.trim();if(!msg||!ME.selectedTicketId)return;try{await api('/api/client/ticket-reply',{ticket_id:ME.selectedTicketId,message:msg});document.getElementById('support-reply-text').value='';await loadSupportThread();toast('Сообщение передано администратору')}catch(err){toast(err.message)}}
async function checkCRM(){const box=document.getElementById('crm-connection');if(!box)return;box.textContent='Проверяю соединение…';try{const d=await api('/api/admin/crm-status');box.textContent=d.message}catch(e){box.textContent=e.message}}
async function submitSupport(e){e.preventDefault();const msg=document.getElementById('support-text')?.value.trim();if(!msg)return;try{const d=demo?{ticket_id:104+ME.demoMessages.length}:await api('/api/client/support',{message:msg});if(demo)ME.demoMessages.push(msg);toast(`Обращение №${d.ticket_id} передано администратору`);document.getElementById('support-text').value='';await loadSupportTickets()}catch(err){toast(err.message)}}
async function reply(e){e.preventDefault();if(!ME.selectedTicket)return;const message=document.getElementById('reply-text').value.trim();try{if(!demo)await api('/api/admin/reply',{ticket_id:ME.selectedTicket.id,message});else ME.selectedTicket.status='closed';toast(demo?'Демо: ответ сохранён локально':'Ответ сохранён в переписке Mini App');await loadAdminThread();(document.getElementById('reply-text').value='')}catch(err){toast(err.message)}}
async function copyForSms(value){const text=String(value||'');if(!text)return false;try{if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);return true}}catch(_){}try{if(typeof document!=='undefined'&&document.body&&document.createElement&&document.execCommand){const field=document.createElement('textarea');field.value=text;field.setAttribute('readonly','');field.style.position='fixed';field.style.left='-9999px';document.body.appendChild(field);field.focus();field.select();const ok=document.execCommand('copy');document.body.removeChild(field);return Boolean(ok)}}catch(_){}return false}
async function act(action){if(action==='phone-verify'){await verifyPhone();return}if(action.startsWith('visit-cancel-help:')||action.startsWith('visit-cancel:')){const index=Number(action.split(':')[1]);const v=Number.isInteger(index)?ME.myVisits?.[index]:null;if(!v){toast('Обнови список записей.');return}go('support');return}if(action.startsWith('visit-reschedule:')){const [kind,index]=action.split(':');ME.mySelected=ME.myVisits[Number(index)];ME.myAction=kind==='visit-cancel'?'cancel':'reschedule';ME.actionKey=newKey();ME.actionDate='';ME.actionTime='';ME.actionDates=[];ME.actionSlots=[];ME.actionError='';ME.actionResult=null;go('visit-change');if(ME.myAction==='reschedule')await loadActionDates();return}if(action==='visit-confirm'){await confirmVisitAction();return}if(action==='visit-status'){await checkVisitAction();return}if(action==='personal-admin-chat'){go('support');return}if(action==='book-all-categories'){ME.serviceCategory='';ME.serviceGroup='';ME.service='';ME.master='';ME.hairLength='';clearCalendar();render();return}if(action==='browse-all-categories'){ME.browseCategory='';render();return}if(action.startsWith('pick-group:')){chooseGroup(action.slice('pick-group:'.length));ME.step=0;go('book');return}if(action==='review-yandex'){openLink('https://yandex.com/maps/org/nefor_spot/222005155441/reviews/');return}if(action==='review-2gis'){openLink('https://2gis.ru/spb/firm/70000001104633361/tab/reviews');return}if(action.startsWith('go:')){go(action.slice(3));return}if(action==='book-next'){if(ME.step===0){if(!ME.serviceGroup){toast('Сначала выбери услугу');return}ME.step=2;render();return}if(ME.step===1){if(!availableLengths().includes(ME.hairLength)||!ME.service){toast('Выбери доступную длину волос');return}ME.step=3;render();await loadDates();return}if(ME.step===2){if(!ME.master){toast('Выбери мастера');return}if(needsLength()){ME.step=1;render();return}if(!ME.service){toast('Выбери конкретную услугу');return}ME.step=3;render();await loadDates();return}if(ME.step===3){if(!ME.date||!ME.time){toast('Выбери дату и время');return}ME.step=4;ME.bookingError='';ME.requestKey=newKey();ME.clientName=ME.clientName||ME.boot.user?.first_name||'';ME.clientPhone=ME.clientPhone||ME.boot.profile?.phone||'';render();return}return}if(action==='book-prev'){ME.bookingError='';ME.step=ME.step===1?2:ME.step===2?0:ME.step===3?(needsLength()?1:2):Math.max(0,ME.step-1);render();return}if(action==='book-reload'){ME.catalog=null;await loadCatalog();return}if(action==='book-reload-dates'){await loadDates();return}if(action==='booking-fallback'){openLink(ME.boot?.booking_url||'https://link.tetradka.io/box/187686');return}if(action==='book-new'){ME.step=0;ME.serviceGroup='';ME.serviceCategory='';ME.hairLength='';ME.service='';ME.master='';ME.serviceQuery='';clearCalendar();render();return}if(action==='price-open'){openLink('https://neforspot.ru/#services');return}if(action==='my-load'){await loadMy();return}if(action==='support-load'){await loadSupportTickets();return}if(action==='support-thread-load'){await loadSupportThread();return}if(action==='crm-check'){await checkCRM();return}if(action==='chatpush-check'){await checkChatpush();return}if(action==='tomorrow-load'){await loadTomorrow();return}if(action.startsWith('tomorrow-filter:')){const value=action.slice('tomorrow-filter:'.length);if(['all','notified','sms','check','other'].includes(value)){ME.tomorrowFilter=value;drawTomorrow()}return}if(action==='tickets-load'){await loadTickets();return}if(action==='clients-load'){await loadClients();return}if(action==='bookings-load'){await loadAdminBookings();return}if(action==='notifications-load'){await loadNotifications();return}if(action==='direct-chat'){const user=ME.selectedTicket?.telegram_username;if(!user||!/^[A-Za-z0-9_]{5,32}$/.test(user)){toast('Нет подтверждённого Telegram-имени клиента');return}openLink('https://t.me/'+user);return}if(action.startsWith('chatpush-reconcile:')){const state=action.slice('chatpush-reconcile:'.length),v=ME.selectedVisit;const check=document.getElementById('chatpush-reconcile-consent');if(!v||!ME.fresh||!check||!check.checked){toast('Сначала проверь историю ChatPush и подтверди это');return}if(!['delivered','failed','unknown'].includes(state))return;try{await api('/api/admin/chatpush/reconcile',{visit_id:String(v.visit_id),day:String(v.day),state,checked_external_chatpush:true});toast('Результат сверки ChatPush сохранён')}catch(error){toast(error.message||'Не удалось сохранить результат');return}const id=String(v.visit_id),day=String(v.day);await loadTomorrow();ME.selectedVisit=ME.visits.find(x=>String(x.visit_id)===id&&String(x.day)===day)||null;if(ME.selectedVisit)go('detail');return}if(action==='copy-phone'){const phone=normalizedSmsPhone(ME.selectedVisit?.phone);if(!phone){toast('Номер для SMS не указан');return}toast(await copyForSms(phone)?'Номер скопирован':'Не удалось скопировать. Номер можно выделить на экране.');return}if(action==='copy-sms'){if(!ME.selectedVisit)return;toast(await copyForSms(localSms(ME.selectedVisit))?'Текст SMS скопирован':'Выдели текст SMS и скопируй вручную');return}if(action.startsWith('mark:')){const state=action.slice(5),v=ME.selectedVisit;if(!v||!ME.fresh){toast('Сначала обнови расписание Тетрадки');return}if(state==='sms_sent'){const checkbox=document.getElementById('sms-acknowledge');if(!checkbox||!checkbox.checked){toast('Подтверди, что SMS действительно отправлена');return}const kind=adminNotice(v);if(kind.bucket==='notified'||kind.bucket==='other'){toast('Повторная SMS не нужна или запрещена');return}}try{if(!demo)await api('/api/admin/mark',{visit_id:v.visit_id,day:v.day,state});v.manual_state=state;v.delivery_status=({sms_sent:'sms_sent',confirmed:'confirmed',skipped:'skipped',pending:'pending'})[state]||'pending';if(state==='sms_sent'){v.notice_state='notified';v.notice_channel='sms';v.notice_source='admin_manual';v.outreach_state='handled';ME.tomorrowFilter='all'}else if(state==='confirmed'){v.notice_state='confirmed';v.notice_source='admin_manual';v.outreach_state='handled'}else if(state==='skipped'){v.notice_state='skipped';v.outreach_state='handled'}else{v.notice_state='unverified';v.outreach_state='sms_needed'}toast('Отметка сохранена в NEFOR SPOT');render()}catch(err){toast(err.message)}return}if(action==='ticket-close'){try{if(!demo)await api('/api/admin/close',{ticket_id:ME.selectedTicket.id});else ME.selectedTicket.status='closed';toast('Обращение закрыто');go('tickets')}catch(err){toast(err.message)}return}}
ROOT.addEventListener('click',async e=>{try{iosProbe('handler-main');const category=e.target.closest('[data-service-category]');if(category){chooseServiceCategory(category.dataset.serviceCategory);return}const browseCategory=e.target.closest('[data-browse-category]');if(browseCategory){chooseBrowseCategory(browseCategory.dataset.browseCategory);return}const group=e.target.closest('[data-service-group]');if(group){chooseGroup(group.dataset.serviceGroup);return}const length=e.target.closest('[data-hair-length]');if(length){chooseLength(length.dataset.hairLength);return}const concrete=e.target.closest('[data-concrete-service]');if(concrete){chooseConcreteService(concrete.dataset.concreteService);return}const service=e.target.closest('[data-service]');if(service){selectService(service.dataset.service);return}const master=e.target.closest('[data-master]');if(master){selectMaster(master.dataset.master);return}const mbook=e.target.closest('[data-master-book]');if(mbook){ME.step=0;ME.serviceGroup='';ME.hairLength='';ME.service='';ME.master='';go('book');toast('Выбери услугу и мастера');return}const serviceGroupBook=e.target.closest('[data-service-group-book]');if(serviceGroupBook){chooseGroup(serviceGroupBook.dataset.serviceGroupBook);ME.step=0;go('book');return}const sbook=e.target.closest('[data-service-book]');if(sbook){const found=selections().find(s=>String(s.id)===String(sbook.dataset.serviceBook));if(found){const group=familyOf(found);ME.serviceGroup=group.key;ME.hairLength='';ME.service='';ME.master='';clearCalendar();ME.step=2}else ME.step=0;go('book');return}const actionDay=e.target.closest('[data-action-day]');if(actionDay){await loadActionSlots(actionDay.dataset.actionDay);return}const actionTime=e.target.closest('[data-action-time]');if(actionTime){ME.actionTime=actionTime.dataset.actionTime;render();return}const dayReal=e.target.closest('[data-real-day]');if(dayReal){await loadSlots(dayReal.dataset.realDay);return}const timeReal=e.target.closest('[data-real-time]');if(timeReal){ME.time=timeReal.dataset.realTime;render();return}const day=e.target.closest('[data-demo-day]');if(day){ME.demoDay=day.dataset.demoDay;render();return}const clock=e.target.closest('[data-demo-time]');if(clock){ME.demoTime=clock.dataset.demoTime;render();return}const filter=e.target.closest('[data-tomorrow-filter]');if(filter){await act('tomorrow-filter:'+filter.dataset.tomorrowFilter);return}const visit=e.target.closest('[data-visit]');if(visit){ME.selectedVisit=ME.visits[Number(visit.dataset.visit)];go('detail');return}const ticket=e.target.closest('[data-ticket]');if(ticket){ME.selectedTicket=ME.tickets[Number(ticket.dataset.ticket)];go('ticket');return}const b=e.target.closest('[data-action]');if(b){await act(b.dataset.action)}}catch(err){iosProbe('action-failed');iosError(err);status('Ошибка интерфейса. Попробуй открыть раздел заново.')}});
NAV.addEventListener('click',e=>{iosProbe('handler-nav');const b=e.target.closest('[data-action]');if(b)act(b.dataset.action).catch(err=>{iosProbe('action-failed');iosError(err);status('Ошибка перехода. Попробуй открыть раздел заново.')})});
ROOT.addEventListener('input',e=>{if(e.target.id==='search-clients'){ME.search=e.target.value;showClients()}if(e.target.id==='booking-search'){ME.serviceQuery=e.target.value;render();const x=document.getElementById('booking-search');x?.focus();x?.setSelectionRange(ME.serviceQuery.length,ME.serviceQuery.length)}});
ROOT.addEventListener('change',e=>{if(e.target.id==='booking-consent')ME.consent=e.target.checked;if(e.target.id==='sms-acknowledge'){const button=document.getElementById('mark-sms-sent');if(button)button.disabled=!e.target.checked}});
ROOT.addEventListener('submit',e=>{if(e.target.id==='booking-form')submitBooking(e);if(e.target.id==='reply-form')reply(e);});
function readPending(){try{return JSON.parse(localStorage.getItem('nefor-action-'+ME.boot.user.id)||'null')}catch{return null}}
function savePending(value){try{const k='nefor-action-'+ME.boot.user.id;if(value)localStorage.setItem(k,JSON.stringify(value));else localStorage.removeItem(k)}catch{}}
async function verifyPhone(){if(ME.phoneBusy)return;if(!TG?.requestContact||TG.isVersionAtLeast&&!TG.isVersionAtLeast('6.9')){toast('Обнови Telegram: эта версия не поддерживает подтверждение номера в приложении.');return}ME.phoneBusy=true;try{await api('/api/client/phone-verification/start',{});const accepted=await new Promise(resolve=>TG.requestContact(resolve));if(!accepted){toast('Подтверждение номера отменено.');return}status('Проверяю подтверждение номера…');for(let i=0;i<20;i++){const p=await api('/api/client/profile');if(p.phone_verified){ME.boot.profile=p;status('');toast('Номер подтверждён. Настройки уведомлений не изменены.');await loadMy();return}await new Promise(resolve=>setTimeout(resolve,1000))}toast('Подтверждение ещё обрабатывается. Нажми «Проверить записи» через несколько секунд.')}catch(e){toast(e.message)}finally{ME.phoneBusy=false;status('')}}
function visitChange(){const v=ME.mySelected;if(!v)return my();const result=ME.actionResult;const details=`<div class="card"><b>${ESC(v.date)} · ${ESC(v.time)}</b><p>${ESC(v.service)} · ${ESC(v.master)}</p></div>`;if(result)return neforPageHeader('Результат изменения',result.confirmed?'Подтверждено CRM':'Проверяется CRM','my')+details+`<div class="notice">${ESC(result.message)}</div>`+(result.confirmed?btn('К моим записям','go:my','btn-primary btn-block'):btn('Проверить результат','visit-status','btn-primary btn-block'));const calendar=ME.myAction==='reschedule'?`<h2 class="section-title">Новая дата</h2><div class="date-grid">${(ME.actionDates||[]).map(d=>`<button class="btn ${ME.actionDate===d?'btn-primary':''}" data-action-day="${ESC(d)}">${ESC(dateLabel(d))}</button>`).join('')}</div><h2 class="section-title">Новое время</h2><div class="time-grid">${(ME.actionSlots||[]).map(t=>`<button class="btn ${ME.actionTime===t?'btn-primary':''}" data-action-time="${ESC(t)}">${ESC(t)}</button>`).join('')}</div>`:'';return neforPageHeader(ME.myAction==='cancel'?'Отменить запись':'Перенести запись','Проверь данные и подтверди действие.','my')+details+calendar+(ME.actionError?`<div class="notice">${ESC(ME.actionError)}</div>`:'')+`<div class="notice">${ME.myAction==='cancel'?'Отменить указанный визит?':'Перенести визит на '+ESC(ME.actionDate||'выбранную дату')+' в '+ESC(ME.actionTime||'выбранное время')+'?'}</div><button type="button" class="btn btn-primary btn-block" data-action="visit-confirm" ${ME.actionBusy||ME.myAction==='reschedule'&&(!ME.actionDate||!ME.actionTime)?'disabled':''}>${ME.actionBusy?'Проверяю CRM…':ME.myAction==='cancel'?'Да, отменить запись':'Да, перенести запись'}</button><div class="spacer"></div>${btn('Вернуться без изменения','go:my','btn-block')}`}
async function loadActionDates(){try{const d=await api('/api/client/visit-calendar?ref='+encodeURIComponent(ME.mySelected.ref));ME.actionDates=d.dates||[];if(!ME.actionDates.length)ME.actionError='Свободных дат для переноса пока нет.'}catch(e){ME.actionError=e.message}if(ME.view==='visit-change')render()}
async function loadActionSlots(day){ME.actionDate=day;ME.actionTime='';ME.actionSlots=[];ME.actionError='';render();const ref=ME.mySelected.ref;try{const d=await api('/api/client/visit-calendar?ref='+encodeURIComponent(ref)+'&date='+encodeURIComponent(day));if(ME.mySelected.ref===ref&&ME.actionDate===day){ME.actionSlots=d.slots||[];if(!ME.actionSlots.length)ME.actionError='Свободных часов на эту дату нет.'}}catch(e){ME.actionError=e.message}if(ME.view==='visit-change')render()}
async function confirmVisitAction(){if(ME.actionBusy)return;ME.actionBusy=true;ME.actionError='';render();const pending={requestKey:ME.actionKey,action:ME.myAction};savePending(pending);try{const d=await api('/api/client/visit-action',{ref:ME.mySelected.ref,action:ME.myAction,requestKey:ME.actionKey,date:ME.actionDate,time:ME.actionTime,confirmed:true});ME.actionResult=d;if(d.confirmed===true){savePending(null);toast(d.message)}else savePending({requestKey:d.requestKey,action:d.action})}catch(e){ME.actionError=e.message;if(e.status&&e.status<500)savePending(null);else ME.actionResult={confirmed:false,message:'Ответ не получен. Проверь результат в CRM перед повторением.'}}finally{ME.actionBusy=false;if(ME.view==='visit-change')render()}}
async function checkVisitAction(){const p=readPending()||{requestKey:ME.actionKey};if(!p.requestKey)return;try{const d=await api('/api/client/visit-action-status?requestKey='+encodeURIComponent(p.requestKey));if(d.confirmed===true||d.state==='rejected')savePending(null);if(ME.view==='visit-change'){ME.actionResult=d;render()}else{toast(d.message);await loadMy()}}catch(e){if(e.status===404)savePending(null);toast(e.message)}}
async function boot(){try{TG?.ready?.();TG?.expand?.()}catch(e){}if(demo){status('');NAV.innerHTML='';ROOT.innerHTML=adminMode?'<h1 class="page-title">Открой админку через Telegram</h1><p class="page-subtitle">Прямой браузерный адрес не подтверждает права администратора. Запусти NEFOR SPOT ADMIN и открой кнопку Mini App.</p>':'<h1 class="page-title">Запись в NEFOR SPOT</h1><p class="page-subtitle">Для настоящей записи открой Mini App кнопкой внутри Telegram. В браузере без Telegram нельзя подтвердить визит — здесь не показываются вымышленные часы.</p><a class="btn btn-primary btn-block" href="https://t.me/NEFORSPOTBOT" rel="noopener noreferrer">Открыть @NEFORSPOTBOT →</a><p class="section-caption">В боте нажми «Записаться» или «Открыть приложение». После этого будут доступны реальные свободные часы и подтверждение в Tetradka.</p>';return}ROOT.innerHTML='<div class="loading">Подключаю NEFOR SPOT…</div>';try{ME.boot=await api('/api/bootstrap');if(!ME.boot||!ME.boot.user)throw new Error('Сервер вернул некорректные данные запуска.');status(ME.boot.version==='9.4'?'':'Сервер обновляется. При проблемах открой приложение заново.');render();iosProbe('app-ready');if(!adminMode)loadCatalog()}catch(err){iosProbe('app-failed');const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));ROOT.innerHTML=`<div class="empty"><h2>Не удалось войти</h2><p>${ESC(err.message)}</p><p>Проверь соединение или обнови приложение.</p><a class="btn btn-primary btn-block" href="${ESC(url.pathname+url.search)}">Обновить приложение</a></div>`;NAV.innerHTML=''}}
boot();
});
